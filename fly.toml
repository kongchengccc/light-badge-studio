# Fly.io 部署： fly launch --copy-config --no-deploy
app = "badge-studio"
primary_region = "hkg"

[build]
  dockerfile = "Dockerfile"

[env]
  LB_STORAGE = "/data"
  CHROME_BIN = "/usr/bin/chromium"

[[mounts]]
  source = "badge_studio_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"
