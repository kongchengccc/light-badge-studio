<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>export</title>
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c"></canvas>
<div id="out"></div>
<script src="js/engine.js"></script>
<script>
(async () => {
  const q = new URLSearchParams(location.search);
  const cfgRaw = decodeURIComponent(q.get("cfg") || "");
  const cfg = JSON.parse(atob(cfgRaw));
  const base = q.get("assetBase") || "";
  const start = parseInt(q.get("start") || "0", 10);
  const count = parseInt(q.get("count") || "1", 10);

  const cv = document.getElementById("c");
  const eng = new window.BadgeEngine.Engine(cv);
  await eng.load(cfg.project, base);
  if (cfg.fontUrl) await eng.loadFont(cfg.fontUrl);
  const out = document.getElementById("out");
  for (let i = 0; i < count; i++) {
    eng.render((start + i) / (cfg.render.fps || 30));
    const url = cv.toDataURL("image/png");
    const d = document.createElement("div");
    d.className = "x"; d.setAttribute("data-i", String(start + i)); d.textContent = url;
    out.appendChild(d);
  }
  document.title = "EXPORT_DONE";
})();
</script></body></html>
