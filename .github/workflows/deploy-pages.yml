name: Deploy Pages

on:
  # 需要先在 Settings → Pages 手动启用一次 Pages，
  # 之后这个工作流才能用官方 API 部署。所以改成手动触发。
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # 自动开启 Pages（不需要手动去 Settings 里选 Source）
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
